<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RETAIL MEDIA QUEST</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: 固定トップバー（ROUND・進行状況）＋ 16:9を意識した中央ステージ ＋ 注意書きフッター */
:root{
  --bg:#f6f3ec;
  --surface:#fffdf9;
  --surface-2:#efe9de;
  --line:#e0d8ca;
  --navy:#132a4f;
  --navy-2:#2a4878;
  --ink:#18213a;
  --muted:#5a6378;
  --mint:#2bb39b;
  --mint-ink:#0d7766;
  --mint-soft:#dcf2ec;
  --coral:#ee6a4d;
  --coral-ink:#b8432a;
  --coral-soft:#fde6df;
  --gold:#c8952a;
  --gold-ink:#8a620c;
  --gold-soft:#f6ecd3;
  --sky:#3f6fb5;
  --sky-soft:#e1eaf7;
  --focus:#1f6fd1;
  --font-body:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic UI","Yu Gothic",Meiryo,system-ui,sans-serif;
  --font-num:"Avenir Next","Segoe UI","Helvetica Neue",Arial,"Hiragino Sans","Noto Sans JP",sans-serif;
  --radius:10px;
  --shadow:0 1px 2px rgba(19,42,79,.06),0 10px 28px rgba(19,42,79,.07);
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font-family:var(--font-body);font-size:14px;line-height:1.65;
  -webkit-font-smoothing:antialiased;
}
button,input,select{font:inherit;color:inherit}
h1,h2,h3,h4{margin:0;line-height:1.35;text-wrap:balance;color:var(--navy)}
p{margin:0}
.num{font-family:var(--font-num);font-variant-numeric:tabular-nums;letter-spacing:.01em}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);border:0}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:6px}
h2[tabindex="-1"]:focus,h2[tabindex="-1"]:focus-visible{outline:none}

/* ---------- Top bar（1行・最小限の高さ） ---------- */
.topbar{
  position:sticky;top:env(safe-area-inset-top,0px);z-index:20;
  background:var(--navy);color:#fff;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:5px;
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:21;background:var(--navy)}
.topbar-inner{max-width:1280px;margin:0 auto;display:flex;align-items:center;gap:6px 14px;flex-wrap:wrap;min-height:26px}
.brand{display:flex;align-items:center;gap:7px;min-width:0}
.brand-mark{width:18px;height:18px;border-radius:5px;background:var(--mint);position:relative;flex:none}
.brand-mark::before,.brand-mark::after{content:"";position:absolute;background:var(--navy);border-radius:1px}
.brand-mark::before{left:4px;bottom:4px;width:2px;height:5px}
.brand-mark::after{left:8px;bottom:4px;width:2px;height:9px;box-shadow:4px 3px 0 0 var(--navy)}
.brand strong{font-family:var(--font-num);font-size:11px;letter-spacing:.12em;font-weight:700;white-space:nowrap}
.rounds{display:flex;gap:4px}
.round-pill{font-family:var(--font-num);font-size:10px;letter-spacing:.06em;padding:0 7px;line-height:18px;border-radius:99px;border:1px solid rgba(255,255,255,.28);color:rgba(255,255,255,.7);white-space:nowrap}
.round-pill.is-current{background:var(--mint);border-color:var(--mint);color:var(--navy);font-weight:700}
.round-pill.is-done{color:#fff;border-color:rgba(255,255,255,.6)}
.round-pill.is-done::before{content:"✓"}
.prog-wrap{display:flex;align-items:center;gap:8px;flex:1 1 160px;min-width:0}
.progress{list-style:none;margin:0;padding:0;display:flex;gap:3px;flex:0 1 150px;min-width:70px}
.progress li{flex:1 1 0;height:4px;border-radius:2px;background:rgba(255,255,255,.18)}
.progress li.is-done{background:var(--mint)}
.progress li.is-current{background:#fff}
.prog-label{font-size:11px;color:rgba(255,255,255,.85);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.top-actions{display:flex;align-items:center;gap:4px;margin-left:auto}
.sound-ctrl{display:flex;gap:4px;align-items:center}
.snd{appearance:none;cursor:pointer;font-size:10px;letter-spacing:.03em;padding:0 7px;line-height:18px;border-radius:5px;border:1px solid rgba(255,255,255,.35);background:transparent;color:rgba(255,255,255,.75);white-space:nowrap;transition:background .15s,color .15s}
.snd b{font-family:var(--font-num);margin-left:1px}
.snd-hint{font-size:10px;color:var(--mint);white-space:nowrap}
.snd:hover{background:rgba(255,255,255,.1)}
.snd:active{transform:translateY(1px)}
.snd[aria-pressed="true"]{border-color:var(--mint);color:#fff}
.snd[aria-pressed="true"] b{color:var(--mint)}
.snd[aria-pressed="false"] b{color:rgba(255,255,255,.55)}
@media (max-width:760px){
  .brand strong{display:none}
  .rank-btn .lbl{display:none}
  .snd-hint{display:none}
  .prog-wrap{flex-basis:60px}
  .progress{min-width:48px}
  .topbar-inner{gap:6px 8px;flex-wrap:nowrap}
}
@media (max-width:480px){.prog-label{display:none}}

/* ---------- Stage ---------- */
.stage-wrap{
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:22px 28px;
}
#stage{max-width:1280px;margin:0 auto;min-height:calc(min(1280px,100vw) * 0.5);outline:none;transition:opacity .28s ease,transform .28s ease}
#stage.is-leaving{opacity:0;transform:translateY(6px)}
#stage.is-entering{opacity:0;transform:translateY(-6px);transition:none}
.screen{display:flex;flex-direction:column;gap:18px}
.screen-head{display:flex;flex-wrap:wrap;align-items:flex-end;gap:8px 20px;justify-content:space-between}
.screen-head .titles{min-width:0;display:flex;flex-direction:column;gap:4px}
.eyebrow{font-family:var(--font-num);font-size:11px;letter-spacing:.16em;color:var(--mint-ink);font-weight:700;text-transform:uppercase}
.screen-head h2{font-size:clamp(20px,2.4vw,28px);outline:none}
.lead{color:var(--muted);max-width:70ch}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);min-width:0}
.panel h3{font-size:15px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.stepno{font-family:var(--font-num);font-size:11px;width:22px;height:22px;border-radius:50%;display:inline-grid;place-items:center;background:var(--navy);color:#fff;flex:none}
.muted{color:var(--muted)}
.small{font-size:12px}
.tiny{font-size:11px}

/* ---------- Buttons ---------- */
.btn{
  appearance:none;border:1px solid var(--navy);background:var(--surface);color:var(--navy);
  padding:10px 18px;border-radius:8px;font-weight:700;cursor:pointer;
  display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;
  transition:background .15s ease,color .15s ease,transform .08s ease,box-shadow .15s ease;
}
.btn:hover{background:var(--surface-2)}
.btn:active{transform:translateY(1px) scale(.99)}
.btn[disabled],.btn[aria-disabled="true"]{opacity:.42;cursor:not-allowed;transform:none}
.btn-primary{background:var(--navy);color:#fff}
.btn-primary:hover{background:var(--navy-2)}
.btn-accent{background:var(--coral);border-color:var(--coral);color:#fff}
.btn-accent:hover{background:var(--coral-ink);border-color:var(--coral-ink)}
.btn-mint{background:var(--mint);border-color:var(--mint);color:var(--navy)}
.btn-mint:hover{background:#25a08b}
.btn-ghost{border-color:transparent;background:transparent;color:var(--navy-2);text-decoration:underline;text-underline-offset:3px;padding-inline:8px}
.btn-ghost:hover{background:var(--surface-2)}
.btn-sm{min-height:34px;padding:6px 12px;font-size:12px}
.btn-lg{min-height:52px;padding:12px 26px;font-size:16px}
.actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.actions.end{justify-content:flex-end}
.actions.between{justify-content:space-between}

/* ---------- Tutorial ---------- */
.intro{display:grid;grid-template-columns:1.05fr 1fr;gap:24px;align-items:stretch}
.intro-hero{background:var(--navy);color:#fff;border-radius:14px;padding:clamp(22px,3.4vw,44px);display:flex;flex-direction:column;justify-content:space-between;gap:24px;position:relative;overflow:hidden;min-width:0}
.intro-hero h1{color:#fff;font-family:var(--font-num);font-size:clamp(28px,4.4vw,52px);letter-spacing:.06em;line-height:1.08;font-weight:800}
.intro-hero .sub{font-size:clamp(15px,1.6vw,19px);color:var(--mint);font-weight:700;margin-top:10px}
.intro-hero .role{font-size:13px;opacity:.85;max-width:44ch}
.intro-hero canvas{width:100%;height:120px;display:block}
.brand-card{display:inline-flex;align-items:center;gap:10px;border:1px solid rgba(255,255,255,.25);padding:8px 12px;border-radius:8px;font-size:12px;width:fit-content}
.brand-card b{font-family:var(--font-num);letter-spacing:.2em;font-size:15px;color:var(--mint)}
.tut{display:flex;flex-direction:column;gap:16px}
.tut-card{flex:1;display:flex;flex-direction:column;gap:14px;justify-content:center}
.tut-card .big-n{font-family:var(--font-num);font-size:56px;font-weight:800;color:var(--mint);line-height:1}
.tut-card h2{font-size:clamp(22px,2.6vw,30px)}
.tut-card p{font-size:15px;max-width:42ch}
.tut-visual{display:flex;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface-2);padding:3px 10px;border-radius:99px;font-size:12px;white-space:nowrap}
.chip.mint{background:var(--mint-soft);border-color:#b7e4d9;color:var(--mint-ink)}
.chip.coral{background:var(--coral-soft);border-color:#f6c4b7;color:var(--coral-ink)}
.chip.gold{background:var(--gold-soft);border-color:#ead59e;color:var(--gold-ink)}
.chip.sky{background:var(--sky-soft);border-color:#bccde8;color:var(--sky)}
.chip.navy{background:var(--navy);border-color:var(--navy);color:#fff}
.dots{display:flex;gap:8px}
.dots span{width:28px;height:4px;border-radius:2px;background:var(--line)}
.dots span.on{background:var(--navy)}

/* ---------- Plan ---------- */
.plan-grid{display:grid;grid-template-columns:1.25fr 1fr 1fr;gap:16px;align-items:start}
.media-row{display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:12px 0;border-bottom:1px dashed var(--line)}
.media-row:last-of-type{border-bottom:none}
.media-name{font-weight:700;display:flex;align-items:center;gap:8px;color:var(--navy)}
.media-ico{width:26px;height:26px;border-radius:6px;display:grid;place-items:center;font-size:11px;font-weight:800;color:#fff;font-family:var(--font-num);flex:none}
.ico-tv{background:var(--navy-2)}
.ico-dooh{background:var(--mint-ink)}
.ico-sig{background:var(--coral-ink)}
.ico-dig{background:var(--sky)}
.media-val{text-align:right;font-weight:800;font-size:18px;color:var(--navy)}
.media-val small{font-size:11px;font-weight:400;color:var(--muted)}
.media-tags{grid-column:1 / -1;display:flex;gap:6px;flex-wrap:wrap}
.media-tags .chip{font-size:11px;padding:1px 8px}
input[type=range]{grid-column:1 / -1;width:100%;accent-color:var(--navy);height:28px;cursor:pointer}
.media-reach{grid-column:1 / -1;font-size:12px;color:var(--muted)}
.sig-bubble{grid-column:1 / -1;justify-self:start;font-weight:800;font-size:15px;padding:4px 12px;border-radius:14px;position:relative;animation:bubble-pop 1.8s steps(1,end) forwards}
.sig-bubble.yay{background:var(--gold-soft);color:var(--gold-ink);border:2px solid var(--gold)}
.sig-bubble.aww{background:var(--surface-2);color:var(--muted);border:2px solid var(--line)}
.sig-bubble::before{content:"";position:absolute;left:18px;top:-8px;border:6px solid transparent;border-bottom-color:inherit}
@keyframes bubble-pop{0%{transform:scale(.6)}8%{transform:scale(1.12)}16%{transform:scale(1)}85%{opacity:1}100%{opacity:0}}
.alloc-bar{display:flex;height:14px;border-radius:7px;overflow:hidden;background:var(--surface-2);margin-top:10px}
.alloc-bar span{display:block;height:100%;transition:width .25s ease}
.sum-badge{margin-left:auto;font-size:12px;font-weight:700;padding:2px 10px;border-radius:99px;background:var(--mint-soft);color:var(--mint-ink)}
.opt-list{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.opt{position:relative;display:block;cursor:pointer}
.opt input{position:absolute;opacity:0;width:1px;height:1px}
.opt .box{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:var(--surface);transition:border-color .15s,background .15s,box-shadow .15s}
.opt:hover .box{border-color:var(--navy-2)}
.opt input:checked + .box{border-color:var(--navy);background:#eef2f8;box-shadow:inset 0 0 0 1px var(--navy)}
.opt input:focus-visible + .box{outline:3px solid var(--focus);outline-offset:2px}
.opt.is-locked{cursor:not-allowed}
.opt.is-locked .box{opacity:.45;background:var(--surface-2)}
.opt.is-locked:hover .box{border-color:var(--line)}
.insight-box{display:grid;grid-template-columns:1fr minmax(0,38ch);gap:8px 24px;align-items:center;background:var(--gold-soft);border:1px solid #ead59e;border-radius:10px;padding:14px 18px}
.insight-box .ins-main{font-size:16px;color:var(--navy);display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:2px 0}
.insight-box .eyebrow{color:var(--gold-ink)}
.seg-index .hbar{grid-template-columns:minmax(150px,auto) 1fr 52px}
.seg-index .hbar.top span:first-child{font-weight:800;color:var(--navy)}
@media (max-width:760px){.insight-box{grid-template-columns:1fr}.seg-index .hbar{grid-template-columns:110px 1fr 46px}}
.radio-ind{width:16px;height:16px;border-radius:50%;border:2px solid var(--muted);flex:none;margin-top:3px;display:grid;place-items:center}
.opt input:checked + .box .radio-ind{border-color:var(--navy)}
.opt input:checked + .box .radio-ind::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--navy)}
.opt .t{font-weight:700;color:var(--navy);display:block}
.opt .d{font-size:12px;color:var(--muted);display:block}
.opt .copy{font-size:13px;display:block;color:var(--ink)}
.plan-foot{display:grid;grid-template-columns:1fr auto;gap:16px;align-items:center}
.summary-line{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.prev-hint{border-left:3px solid var(--mint);background:var(--mint-soft);padding:10px 14px;border-radius:0 8px 8px 0;font-size:13px}
.prev-hint b{color:var(--mint-ink)}

/* ---------- トップ画面のタイトルバナー（中央揃え） ---------- */
.title-banner{background:var(--navy);color:#fff;border-radius:14px;padding:clamp(22px,3.2vw,40px) 20px clamp(18px,2.6vw,30px);text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px;overflow:hidden}
.tb-row{display:flex;align-items:center;justify-content:center;gap:clamp(14px,2.4vw,36px);width:100%}
.tb-title{color:#fff;font-family:var(--font-num);font-weight:800;font-size:clamp(30px,4vw,60px);letter-spacing:.07em;line-height:1.05;white-space:nowrap;text-shadow:0 4px 0 rgba(43,179,155,.55)}
.tb-sub{color:var(--mint);font-weight:700;font-size:clamp(14px,1.7vw,20px);letter-spacing:.06em}
.px-side{position:relative;display:flex;gap:clamp(8px,1.2vw,16px);align-items:center;flex:none}
.title-banner .px-lg{width:clamp(34px,3.6vw,52px);height:clamp(34px,3.6vw,52px)}
.title-banner .px-star.s0{top:-10px;left:-14px}
.title-banner .px-star.s1{top:-10px;right:-14px}
.title-banner .px-star.s2{bottom:-12px;left:40%}
@media (max-width:1000px){
  .tb-row{flex-wrap:wrap}
  .tb-title{order:-1;flex-basis:100%;white-space:normal}
}

/* ---------- ドット絵アイコン（ピコピコ動く） ---------- */
.hero-title-row{display:flex;align-items:center;gap:20px 28px;flex-wrap:wrap}
.px-cluster{position:relative;display:grid;grid-template-columns:repeat(3,auto);gap:14px 18px;padding:10px 4px}
.px{display:inline-block;cursor:pointer;animation:pico .9s steps(1,end) infinite;animation-delay:calc(var(--i) * -.15s)}
.px svg{display:block;width:100%;height:100%}
.px-lg{width:clamp(40px,4.4vw,58px);height:clamp(40px,4.4vw,58px)}
.px-sm{width:20px;height:20px;animation-name:pico-sm}
.px:nth-child(even){animation-name:pico-alt}
.px-sm:nth-child(even){animation-name:pico-sm-alt}
.px:hover{filter:brightness(1.15)}
.px.px-jump{animation:px-jump .5s steps(5,end) 1}
@keyframes pico{0%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes pico-alt{0%{transform:translateY(-4px) rotate(-6deg)}50%{transform:translateY(0) rotate(6deg)}}
@keyframes pico-sm{0%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes pico-sm-alt{0%{transform:translateY(-2px)}50%{transform:translateY(0)}}
@keyframes px-jump{0%{transform:translateY(0) scale(1)}40%{transform:translateY(-18px) scale(1.15)}70%{transform:translateY(-8px) rotate(10deg)}100%{transform:translateY(0)}}
.px-star{position:absolute;width:6px;height:6px;background:#e8b84a;box-shadow:6px 0 0 #fffdf9;animation:twinkle 1.2s steps(1,end) infinite}
.px-star.s0{top:-6px;left:-10px}
.px-star.s1{top:40%;right:-18px;background:#2bb39b;animation-delay:-.4s}
.px-star.s2{bottom:-6px;left:35%;background:#ee6a4d;animation-delay:-.8s}
@keyframes twinkle{0%{opacity:1}33%{opacity:0}66%{opacity:.6}}
@media (max-width:760px){.px-cluster{grid-template-columns:repeat(6,auto);gap:10px}.px-lg{width:36px;height:36px}}

/* ---------- Funnel ---------- */
.funnel-panel{padding:16px 18px 14px}
.stage-labels,.stage-counters{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.stage-labels div{font-size:12px;font-weight:700;color:var(--navy);text-align:center;display:flex;flex-direction:column;align-items:center;gap:2px}
.stage-labels .k{font-family:var(--font-num);font-size:10px;letter-spacing:.12em;color:var(--muted);font-weight:400}
.funnel-canvas{width:100%;height:clamp(170px,22vw,250px);display:block}
.stage-counters .cnt{text-align:center;background:var(--surface-2);border-radius:8px;padding:8px 4px;min-width:0}
.stage-counters .v{font-size:clamp(14px,1.7vw,20px);font-weight:800;color:var(--navy);display:block;white-space:nowrap}
.stage-counters .r{font-size:11px;color:var(--muted);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stage-counters .cnt.buy .v{color:var(--coral-ink)}
.stage-counters .cnt.ltv .v{color:var(--gold-ink)}
.stage-counters .cnt.locked .v{color:var(--muted)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:8px}
.lg{display:inline-flex;align-items:center;gap:6px}
.lg i{display:inline-block;width:10px;height:10px;border-radius:50%}

.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px;min-width:0}
.kpi .l{font-size:12px;color:var(--muted);display:block}
.kpi .v{font-size:clamp(20px,2.2vw,28px);font-weight:800;color:var(--navy);display:block;line-height:1.2;white-space:nowrap}
.kpi .v small{font-size:13px;font-weight:700;margin-left:2px}
.kpi .s{font-size:12px;color:var(--muted)}
.kpi.coral .v{color:var(--coral-ink)}
.kpi.gold .v{color:var(--gold-ink)}
.kpi.mint .v{color:var(--mint-ink)}

.question{background:var(--navy);color:#fff;border-radius:12px;padding:20px 22px;display:flex;gap:16px;align-items:center;flex-wrap:wrap;justify-content:space-between}
.question p{font-size:clamp(17px,2vw,23px);font-weight:700;color:#fff}
.question .q-k{font-family:var(--font-num);color:var(--mint);font-size:11px;letter-spacing:.16em;display:block;margin-bottom:4px}
.question .unlock{font-size:12px;color:var(--mint)}

/* ---------- Doctor ---------- */
.doctor{display:grid;grid-template-columns:64px 1fr;gap:14px;align-items:start;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;box-shadow:var(--shadow)}
.doctor svg{width:64px;height:64px}
.doctor .who{font-weight:800;color:var(--navy);font-size:13px;display:flex;gap:8px;align-items:center}
.doctor .who span{font-family:var(--font-num);font-size:10px;letter-spacing:.14em;color:var(--mint-ink);font-weight:700}
.doctor ul{list-style:none;margin:6px 0 0;padding:0;display:flex;flex-direction:column;gap:6px}
.doctor li{position:relative;padding-left:16px;font-size:14px}
.doctor li::before{content:"";position:absolute;left:0;top:.62em;width:7px;height:7px;border-radius:50%;background:var(--mint)}
.doctor li.warn::before{background:var(--coral)}
.doctor li.gold::before{background:var(--gold)}
.doctor li{animation:say .4s ease both}
@keyframes say{from{opacity:.0;transform:translateX(-4px)}to{opacity:1;transform:none}}
.bonus-list{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}

/* ---------- Analysis ---------- */
.an-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;grid-auto-flow:row dense}
.an-card{position:relative;display:flex;flex-direction:column;gap:10px;min-height:220px}
.an-card.wide{grid-column:1 / -1}
.an-card.half{grid-column:span 2}
.an-card h3 .idx{font-family:var(--font-num);font-size:11px;color:var(--muted);font-weight:400}
.an-card .lockbox{flex:1;display:grid;place-items:center;border:1px dashed var(--line);border-radius:8px;color:var(--muted);font-size:12px;text-align:center;padding:10px;background:repeating-linear-gradient(135deg,transparent 0 8px,rgba(19,42,79,.025) 8px 16px)}
.an-card.is-revealed .lockbox{display:none}
.an-card .content{display:none;flex-direction:column;gap:10px}
.an-card.is-revealed .content{display:flex;animation:reveal .45s ease both}
@keyframes reveal{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.an-card.is-analyzing .lockbox::after{content:"";width:28px;height:4px;border-radius:2px;background:var(--mint);display:block;margin:8px auto 0;animation:scan .8s ease-in-out infinite alternate}
@keyframes scan{from{transform:translateX(-20px)}to{transform:translateX(20px)}}
.donut-wrap{display:grid;grid-template-columns:130px 1fr;gap:18px;align-items:center}
.donut-wrap canvas{width:130px;height:130px}
.legend-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;font-size:12px;min-width:0}
.legend-list li{display:grid;grid-template-columns:16px 1fr auto;gap:8px;align-items:center;font-size:13px}
.legend-list .sw{width:14px;height:14px;display:grid;place-items:center;font-size:10px;color:#fff;border-radius:3px}
.legend-list b{font-family:var(--font-num);font-variant-numeric:tabular-nums}
.hbars{display:flex;flex-direction:column;gap:9px}
.hbar{display:grid;grid-template-columns:minmax(80px,auto) 1fr 52px;gap:8px;align-items:center;font-size:12px}
.hbar .track{display:block;height:12px;background:var(--surface-2);border-radius:6px;overflow:hidden}
.hbar .fill{display:block;height:100%;width:0;border-radius:6px;background:var(--navy-2);transition:width .9s cubic-bezier(.2,.8,.2,1)}
.go .hbar .fill,.go .stack span{width:var(--w)}
.meters{display:flex;flex-direction:column;gap:12px}
.meter-top{display:flex;align-items:center;gap:8px;font-size:12px;margin-bottom:4px}
.meter-top b{margin-left:auto;font-size:13px}
.meter .lv{font-size:10px;font-weight:800;padding:0 6px;border-radius:4px;line-height:16px}
.meter .lv.hi{background:var(--coral-soft);color:var(--coral-ink)}
.meter .lv.mid{background:var(--gold-soft);color:var(--gold-ink)}
.meter .lv.lo{background:var(--surface-2);color:var(--muted)}
.cells{display:grid;grid-template-columns:repeat(10,1fr);gap:3px}
.cells .cell{display:block;height:14px;border-radius:2px;background:var(--surface-2);transition:background-color .15s steps(1,end);transition-delay:calc(var(--k) * 70ms)}
.go .cells .cell.on{background:var(--c)}
.hbar .val{text-align:right;font-weight:700;font-family:var(--font-num);font-variant-numeric:tabular-nums}
.stack{display:flex;height:26px;border-radius:6px;overflow:hidden;background:var(--surface-2)}
.stack span{width:0;height:100%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:11px;font-weight:700;white-space:nowrap;overflow:hidden;transition:width .9s cubic-bezier(.2,.8,.2,1)}
.vbars{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;align-items:end;height:140px;padding-top:4px}
.vbar{display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end}
.vbar .colw{flex:1;width:70%;display:flex;align-items:flex-end;background:var(--surface-2);border-radius:6px 6px 0 0;overflow:hidden}
.vbar .fill{display:block;width:100%;height:0;background:var(--navy-2);transition:height .9s cubic-bezier(.2,.8,.2,1)}
.go .vbar .fill{height:var(--h)}
.vbar .val{font-size:12px;font-weight:700;font-family:var(--font-num)}
.vbar .lab{font-size:11px;color:var(--muted)}
.path-table-wrap{overflow-x:auto}
table.data{width:100%;border-collapse:collapse;font-size:12px;min-width:720px}
table.data th,table.data td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
table.data th{font-weight:700;color:var(--muted);font-size:11px;background:var(--surface-2)}
table.data th:first-child,table.data td:first-child{text-align:left}
table.data td.path{font-weight:700;color:var(--navy)}
table.data tr.best td{background:var(--mint-soft)}
table.data .mini{display:inline-block;height:8px;border-radius:4px;background:var(--coral);vertical-align:middle;margin-right:6px}
.big-stat{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}
.big-stat .v{font-size:40px;font-weight:800;line-height:1;color:var(--gold-ink)}
.big-stat .u{font-weight:700;color:var(--gold-ink)}
.mini-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mini-cards div{background:var(--surface-2);border-radius:8px;padding:8px;font-size:11px;color:var(--muted);min-width:0}
.mini-cards b{display:block;font-size:14px;white-space:nowrap;color:var(--ink);font-family:var(--font-num)}
.note{font-size:11px;color:var(--muted);line-height:1.6}
.disclaimer{font-size:11px;color:var(--muted);border-top:1px solid var(--line);padding-top:10px;display:flex;flex-direction:column;gap:2px}

/* ---------- Next / compare ---------- */
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
.hint-list{display:flex;flex-direction:column;gap:10px;margin-top:10px}
.hint{border:1px solid var(--line);border-radius:8px;padding:12px 14px;background:var(--surface);display:grid;grid-template-columns:30px 1fr;gap:10px}
.hint .hi{width:28px;height:28px;border-radius:50%;background:var(--gold-soft);color:var(--gold-ink);display:grid;place-items:center;font-weight:800;font-family:var(--font-num);font-size:12px}
.hint b{color:var(--navy);display:block}
.hint span{font-size:13px;color:var(--muted)}
table.cmp{width:100%;border-collapse:collapse;font-size:13px}
table.cmp th,table.cmp td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
table.cmp th{font-size:11px;color:var(--muted);background:var(--surface-2)}
table.cmp th:first-child,table.cmp td:first-child{text-align:left;color:var(--navy);font-weight:700}
.delta{font-weight:800;font-family:var(--font-num)}
.delta.up{color:var(--mint-ink)}
.delta.down{color:var(--coral-ink)}
.delta.flat{color:var(--muted)}
.cmp-wrap{overflow-x:auto}

/* ---------- Final / score ---------- */
.final-grid{display:grid;grid-template-columns:1.25fr 1fr;gap:16px;align-items:start}
.score-hero{display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.score-ring{width:150px;height:150px;flex:none}
.score-title{display:flex;flex-direction:column;gap:6px;min-width:0}
.score-title .rank{font-size:clamp(20px,2.4vw,28px);font-weight:800;color:var(--navy)}
.score-items{display:flex;flex-direction:column;gap:9px;margin-top:14px}
.score-item{display:grid;grid-template-columns:150px 1fr 70px;gap:10px;align-items:center;font-size:13px}
.score-item .track{display:block;height:10px;background:var(--surface-2);border-radius:5px;overflow:hidden}
.score-item .fill{display:block;height:100%;width:0;background:var(--mint);transition:width 1s cubic-bezier(.2,.8,.2,1)}
.go .score-item .fill{width:var(--w)}
.score-item .pt{text-align:right;font-weight:800;font-family:var(--font-num)}

/* ---------- Ending ---------- */
.ending{min-height:540px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:28px;padding:30px 0;background:var(--navy);border-radius:14px;color:#fff;padding-inline:20px}
.ending h2{color:#fff;font-size:clamp(28px,4.6vw,56px);letter-spacing:.04em;animation:rise .8s ease both}
.flow{list-style:none;margin:0;padding:0;display:flex;align-items:stretch;gap:0;flex-wrap:wrap;justify-content:center;max-width:1100px}
.flow li{display:flex;align-items:center;opacity:0;animation:rise .6s ease both}
.flow .step{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.22);border-radius:10px;padding:12px 14px;font-weight:700;font-size:14px;max-width:180px}
.flow .step .k{display:block;font-family:var(--font-num);font-size:10px;letter-spacing:.14em;color:var(--mint);font-weight:400}
.flow li:last-child .step{background:var(--gold);border-color:var(--gold);color:var(--navy)}
.flow li:last-child .step .k{color:var(--navy)}
.flow .arr{color:var(--mint);font-size:20px;padding:0 8px}
.ending .closing{max-width:56ch;font-size:clamp(14px,1.5vw,17px);line-height:1.9;opacity:0;animation:rise .8s ease both;animation-delay:3.4s;color:#fff}
.ending .actions{opacity:0;animation:rise .6s ease both;animation-delay:3.9s}
.ending .btn{border-color:#fff}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* ---------- Report ---------- */
.report{display:flex;flex-direction:column;gap:14px}
.report-head{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:flex-end;border-bottom:2px solid var(--navy);padding-bottom:10px}
.report-head h2{font-size:22px}
.report-grid{display:grid;grid-template-columns:1.35fr 1fr;gap:14px;align-items:start}
.report table.cmp{font-size:12px}
.report table.cmp td,.report table.cmp th{padding:6px 8px}
.report .section-t{font-size:12px;font-weight:800;color:var(--navy);letter-spacing:.06em;margin-bottom:6px;display:block}
.report ul.plain{margin:0;padding-left:18px;font-size:13px;display:flex;flex-direction:column;gap:4px}
.print-note{font-size:11px;color:var(--muted)}

/* ---------- ランキング ---------- */
.rank-btn{border-color:var(--gold)!important;color:#fff!important}
.rank-btn:hover{background:rgba(232,184,74,.18)!important}
.rank-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
.rank-stats div{background:var(--surface-2);border-radius:8px;padding:10px 12px;min-width:0}
.rank-stats span{display:block;font-size:11px;color:var(--muted)}
.rank-stats b{font-size:22px;color:var(--navy)}
.rank-stats small{font-size:12px;margin-left:2px}
.my-rank{background:var(--mint-soft);border-radius:8px;padding:8px 12px;margin-bottom:10px;color:var(--ink)}
.my-rank b{color:var(--mint-ink);font-size:16px}
.rank-table-wrap{overflow-x:auto;position:relative}
.rank-table{width:100%;border-collapse:collapse;font-size:13px}
.rank-table th,.rank-table td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap;font-variant-numeric:tabular-nums}
.rank-table th{font-size:11px;color:var(--muted);background:var(--surface-2)}
.rank-table tr.me td{background:var(--mint-soft)}
.rank-table .who-in{display:flex;align-items:center;gap:8px}
.rank-table .avatar{width:24px;height:24px;border-radius:50%;flex:none;background:var(--surface-2)}
.rank-table .pname{font-weight:700;color:var(--navy);overflow:hidden;text-overflow:ellipsis;max-width:22ch}
.rank-table td.score b{font-size:16px;color:var(--navy)}
.rank-table td.del{text-align:right}
.rank-no{display:inline-grid;place-items:center;min-width:28px;height:28px;border-radius:50%;font-weight:800;color:var(--navy);background:var(--surface-2)}
.rank-no.m1{background:#e8b84a;color:#3d2a00}
.rank-no.m2{background:#c9ced8;color:#26303f}
.rank-no.m3{background:#d39a6a;color:#3a1f08}
.rank-empty{color:var(--muted);font-size:13px;padding:6px 0}
.save-note{font-size:13px;padding:8px 12px;border-radius:8px;background:var(--surface-2);margin-bottom:10px}
.save-note.ok{background:var(--gold-soft);color:var(--gold-ink);font-weight:700}
.save-note.warn{background:var(--coral-soft);color:var(--coral-ink)}
.btn-danger{background:var(--coral-ink);border-color:var(--coral-ink);color:#fff}
.btn-danger:hover{background:#9c3620}
@media (max-width:760px){.rank-stats{grid-template-columns:repeat(2,1fr)}}

/* ---------- Footer ---------- */
.foot{
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:14px 20px;border-top:1px solid var(--line);background:var(--surface-2)
}
.foot-inner{max-width:1280px;margin:0 auto;font-size:11px;color:var(--muted);display:flex;flex-direction:column;gap:2px}
.foot-inner strong{color:var(--navy)}

/* ---------- Responsive ---------- */
@media (max-width:1100px){
  .plan-grid{grid-template-columns:1fr 1fr}
  .plan-grid .panel.budget{grid-column:1 / -1}
  .an-grid{grid-template-columns:repeat(2,1fr)}
  .kpis{grid-template-columns:repeat(3,1fr)}
  .final-grid,.report-grid{grid-template-columns:1fr}
}
@media (max-width:760px){
  .intro,.plan-grid,.two-col{grid-template-columns:1fr}
  .plan-foot{grid-template-columns:1fr}
  .an-grid{grid-template-columns:1fr}
  .an-card.wide,.an-card.half{grid-column:auto}
  .kpis{grid-template-columns:repeat(2,1fr)}
  .stage-labels div{font-size:10px}
  .stage-counters .r{display:none}
  .score-item{grid-template-columns:110px 1fr 56px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-delay:0s!important;transition-duration:.001ms!important}
  .flow li,.ending .closing,.ending .actions{opacity:1}
}

/* ---------- Print ---------- */
@media print{
  @page{size:A4 landscape;margin:10mm}
  body{background:#fff;font-size:11px}
  body::before{display:none}
  .topbar,.no-print,.btn,.sound-ctrl{display:none!important}
  .stage-wrap{padding:0}
  #stage{max-width:none;min-height:0}
  .panel{box-shadow:none;break-inside:avoid}
  .foot{background:#fff;border-top:1px solid #ccc;padding:6px 0}
  .report-grid{grid-template-columns:1.35fr 1fr}
}
</style>

<body>

</footer>

<script>
'use strict';
/* =====================================================================
   1. 定数（調整可能なパラメータ）
   ===================================================================== */
/*SIM-START*/
const CONFIG = {

  HOT_VISIT: 1.2,              // その層の来店率の高さ
  INSIGHT_TARGET: 1.22,        // 分析の示唆に合ったターゲティング：購入率の倍率（ROUND 2以降）

  REPURCHASE_BASE: { new: 0.20, rep: 0.46, sw: 0.17 }, // 90日以内の再購入率（基準）
  REPURCHASE_SIG: 1.10,        // 店内サイネージ接触による再購入率の上乗せ
  UNIT_PRICE: 3300,            // 商品単価（円・シャンプー＆トリートメント）

const SEGMENTS = [

/* 広告接触パターン：店外媒体（TVCM・DOOH・デジタル広告）の組み合わせ × 店内サイネージ接触の有無 */
const OUT_MEDIA = ['tv', 'dooh', 'dig'];
const MEDIA_LABEL = { tv: 'TVCM', dooh: 'DOOH', dig: 'デジタル広告', sig: '店内サイネージ' };
const OUT_COMBOS = [1, 2, 4, 3, 5, 6, 7].map(mask => {
  const media = OUT_MEDIA.filter((m, i) => mask & (1 << i));
  return { mask: mask, media: media, key: media.join('+') };
});
const PATTERNS = [].concat(
  OUT_COMBOS.map(c => ({ key: c.key, label: c.media.map(m => MEDIA_LABEL[m]).join('＋') + (c.media.length === 1 ? 'のみ' : '') })),
  [{ key: 'sig', label: '店内サイネージのみ' }],
  OUT_COMBOS.map(c => ({ key: c.key + '+sig', label: c.media.map(m => MEDIA_LABEL[m]).join('＋') + '＋店内サイネージ' })),
  [{ key: 'none', label: '広告接触機会を確認できなかった購入者' }]
);

/* =====================================================================
   2. 汎用ユーティリティ（数値の安全化）
   ===================================================================== */
function safe(n) { return (typeof n === 'number' && isFinite(n) && n > 0) ? n : 0; }
function clamp(n, lo, hi) { n = Number(n); if (!isFinite(n)) n = lo; return Math.min(hi, Math.max(lo, n)); }
function div(a, b) { return safe(b) > 0 ? safe(a) / b : 0; }
function hashStr(s) { let h = 2166136261 >>> 0; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619) >>> 0; } return h; }
function mulberry32(a) {
  return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
}
/* seedとキーから決まる±5%の変動。同じseed・同じラウンドなら、同じ選択でほぼ同じ結果になる */
function noise(seed, key) { const r = mulberry32((seed ^ hashStr(key)) >>> 0)(); return 1 + (r * 2 - 1) * CONFIG.NOISE; }
function mixShare(natural, target, precision) { return (1 - precision) * natural + precision * target; }

/* =====================================================================
   3. シミュレーション（計算処理。UIからは独立）
   ===================================================================== */
function detectBonuses(plan) {
  const B = CONFIG.BONUS;
  const b = { newMult: 1, hair: false, repeatCont: false, station: false, competitorFunc: false, list: [] };
  const doohShare = div(plan.dooh, CONFIG.BUDGET_TOTAL);
  if (plan.target === 'f2030' && plan.msg === 'trial') { b.newMult *= B.f2030Trial; b.list.push('20〜30代女性 × トライアル訴求：新規購入 ×1.25'); }
  if (plan.target === 'haircare' && plan.msg === 'func') { b.hair = true; b.list.push('ヘアケア関心層 × 機能訴求：購入率 ×1.30'); }
  if (plan.target === 'newcand' && plan.msg === 'trial') { b.newMult *= B.newcandTrial; b.list.push('ブランド新規購入候補 × トライアル訴求：新規購入 ×1.35'); }
  if (plan.target === 'repeat' && plan.msg === 'cont') { b.repeatCont = true; b.list.push('リピート候補 × 継続利用訴求：再購入率 ×1.40'); }
  if (plan.target === 'station' && doohShare >= B.stationDoohShare) { b.station = true; b.list.push('平日夕方の駅前利用者 × DOOH重点配分：来店率 ×1.30'); }
  if (plan.msg === 'func') { b.competitorFunc = true; b.list.push('競合ブランド購入者 × 機能訴求：スイッチ候補 ×1.30'); }
  return b;
}

function simulate(planIn, seed, round, ctx) {
  const C = CONFIG;
  const T = C.BUDGET_TOTAL;
  const plan = {
    tv: clamp(planIn.tv, 0, T), dooh: clamp(planIn.dooh, 0, T), dig: clamp(planIn.dig, 0, T), sig: clamp(planIn.sig, 0, T),
    msg: planIn.msg || 'aware', target: planIn.target || 'broad'
  };
  if (round === 1) plan.target = 'broad'; // ROUND 1は購入者データがないため、ターゲットは絞れない
  const msg = MESSAGES.find(m => m.id === plan.msg) || MESSAGES[0];
  const target = TARGETS.find(t => t.id === plan.target) || TARGETS[0];
  const bonus = detectBonuses(plan);
  const hot = ctx && typeof ctx.hot === 'number' ? ctx.hot : -1;
  const ins = (round >= 2 && ctx && ctx.insight) ? ctx.insight : null;
  const insT = !!(ins && ins.targets.indexOf(plan.target) >= 0);
  const insM = !!(ins && ins.msgs.indexOf(plan.msg) >= 0);
  const insMul = (insT ? C.INSIGHT_TARGET : 1) * (insM ? C.INSIGHT_MSG : 1);
  if (insM) bonus.list.unshift('分析の示唆に合った広告メッセージ：購入率 ×' + C.INSIGHT_MSG);
  if (insT) bonus.list.unshift('分析の示唆に合ったターゲティング：購入率 ×' + C.INSIGHT_TARGET);
  const reach = {};
  OUT_MEDIA.forEach(m => { reach[m] = plan[m] / 100 * C.REACH_PER_MILLION[m]; });
  const sigCapacity = plan.sig / 100 * C.REACH_PER_MILLION.sig;
  const c = plan.sig > 0 ? Math.min(C.SIG_CONTACT_MAX, C.SIG_CONTACT_BASE * Math.sqrt(plan.sig / C.SIG_REF_BUDGET)) : 0;
  const precision = { tv: C.PRECISION.tv, dooh: target.id === 'station' ? C.PRECISION.doohStation : C.PRECISION.dooh, dig: C.PRECISION.dig };

  const pat = {};
  PATTERNS.forEach(p => { pat[p.key] = { key: p.key, label: p.label, contacts: 0, visitors: 0, buyers: 0, newB: 0, repB: 0, swB: 0, repurchasers: 0 }; });
  const seg = SEGMENTS.map(s => ({ id: s.id, name: s.name, short: s.short, contacts: 0, visitors: 0, buyers: 0, newB: 0, repB: 0, swB: 0, repurchasers: 0, doohBuyers: 0, sigBuyers: 0, digBuyers: 0 }));
  let uniqueOut = 0;
  const reachU = { tv: 0, dooh: 0, dig: 0 };

  SEGMENTS.forEach((S, s) => {
    const pool = C.POPULATION * S.share;
    // 到達上限：TVCMは視聴者の85%、DOOHは駅前・生活動線を通る人、デジタル広告はネット利用者まで
    const maxR = { tv: C.TV_MAX_REACH, dooh: S.prof.station, dig: S.prof.digital };
    const pr = {};
    OUT_MEDIA.forEach(m => {
      const w = mixShare(S.share, target.dist[s], precision[m]);
      pr[m] = maxR[m] * (1 - Math.exp(-div(reach[m] * w, pool * maxR[m])));
      reachU[m] += pool * pr[m];
    });
    const aff = msg.aff[s];
    const nv = noise(seed, round + ':visit:' + s);
    const nb = noise(seed, round + ':buy:' + s);

    const visitRate = (combo) => {
      let r = C.BASE_VISIT * Math.max.apply(null, combo.media.map(m => C.MEDIA_VISIT[m]));
      r *= C.OVERLAP_VISIT[combo.key] || 1;
      r *= Math.sqrt(aff);
      if (s === 4 && combo.media.indexOf('tv') >= 0) r *= 1.2;            // 「その他」はTVCMの認知に反応
      if (bonus.station && combo.media.indexOf('dooh') >= 0) r *= C.BONUS.stationDooh;
      if (target.id !== 'broad' && combo.media.indexOf('dig') >= 0) r *= C.DIG_TARGETED; // 絞り込んだデジタル広告は関心の高い人に届く
      if (s === hot) r *= C.HOT_VISIT;
      return clamp(r * nv, 0, 0.5);
    };
    const buyRate = (combo, sigSeen) => {
      let r;
      if (sigSeen) {
        r = C.BUY_SIG * (combo ? (C.OVERLAP_SIG[combo.key] || 1) : 1);
        if (s === 0 && combo && combo.media.indexOf('dooh') >= 0) r *= 1.15; // 20〜30代女性・駅前はDOOH＋サイネージの重複に反応
      } else {
        r = combo ? C.BUY_NOSIG : C.BUY_UNLINKED;
      }
      const msgSeen = sigSeen || !!combo;
      if (s === hot) r *= C.HOT_BUY;
      if (msgSeen) { r *= aff * insMul; if (bonus.hair) r *= C.BONUS.hairFunc; }
      return clamp(r * nb, 0, 0.6);
    };

    const groups = [];
    OUT_COMBOS.forEach(combo => {
      let prob = 1;
      OUT_MEDIA.forEach(m => { prob *= combo.media.indexOf(m) >= 0 ? pr[m] : (1 - pr[m]); });
      const ex = pool * prob;
      seg[s].contacts += ex; uniqueOut += ex;
      const v = ex * visitRate(combo);
      const flags = { dooh: combo.media.indexOf('dooh') >= 0, dig: combo.media.indexOf('dig') >= 0 };
      groups.push(Object.assign({ pat: combo.key, contacts: ex * (1 - c), visitors: v * (1 - c), rate: buyRate(combo, false), sig: false, msg: true }, flags));
      groups.push(Object.assign({ pat: combo.key + '+sig', contacts: ex * c, visitors: v * c, rate: buyRate(combo, true), sig: true, msg: true }, flags));
    });
    const org = C.ORGANIC_SHOPPERS * S.share;
    groups.push({ pat: 'sig', contacts: org * c, visitors: org * c, rate: buyRate(null, true), sig: true, msg: true, dooh: false, dig: false });
    groups.push({ pat: 'none', contacts: 0, visitors: org * (1 - c), rate: buyRate(null, false), sig: false, msg: false, dooh: false, dig: false });

    const nr = noise(seed, round + ':rep:' + s);
    groups.forEach(g => {
      const base = safe(g.visitors * g.rate);
      let mN = 1, mR = 1, mW = 1;
      if (g.msg) {
        mN *= msg.typeMod.new * bonus.newMult; mR *= msg.typeMod.rep; mW *= msg.typeMod.sw;
        if (bonus.competitorFunc && s === 3) mW *= C.BONUS.competitorFunc;
      }
      const nN = base * S.mix[0] * mN, nR = base * S.mix[1] * mR, nW = base * S.mix[2] * mW;
      const rb = C.REPURCHASE_BASE;
      let rN = rb.new, rR = rb.rep, rW = rb.sw;
      if (g.sig) { rN *= C.REPURCHASE_SIG; rR *= C.REPURCHASE_SIG; rW *= C.REPURCHASE_SIG; }
      if (g.msg) {
        rN *= msg.repMod.new; rR *= msg.repMod.rep; rW *= msg.repMod.sw;
        if (bonus.repeatCont) { rN *= C.BONUS.repeatCont; rR *= C.BONUS.repeatCont; rW *= C.BONUS.repeatCont; }
      }
      rN = clamp(rN * nr, 0, 0.85); rR = clamp(rR * nr, 0, 0.85); rW = clamp(rW * nr, 0, 0.85);
      const buyers = nN + nR + nW;
      const rep = nN * rN + nR * rR + nW * rW;
      const P = pat[g.pat];
      P.contacts += g.contacts; P.visitors += g.visitors; P.buyers += buyers; P.newB += nN; P.repB += nR; P.swB += nW; P.repurchasers += rep;
      const Sg = seg[s];
      Sg.visitors += g.visitors; Sg.buyers += buyers; Sg.newB += nN; Sg.repB += nR; Sg.swB += nW; Sg.repurchasers += rep;
      if (g.dooh) Sg.doohBuyers += buyers;
      if (g.dig) Sg.digBuyers += buyers;
      if (g.sig) Sg.sigBuyers += buyers;
    });
  });

  const patterns = PATTERNS.map(p => {
    const P = pat[p.key];
    return Object.assign(P, {
      visitRate: p.key === 'none' ? 0 : (p.key === 'sig' ? 1 : div(P.visitors, P.contacts)),
      buyRate: div(P.buyers, P.visitors), newRate: div(P.newB, P.buyers), swRate: div(P.swB, P.buyers), repRate: div(P.repurchasers, P.buyers)
    });
  });
  const sum = (k) => patterns.reduce((a, p) => a + safe(p[k]), 0);
  const buyers = sum('buyers');
  const linked = patterns.filter(p => p.key !== 'none');
  const visitors = linked.reduce((a, p) => a + safe(p.visitors), 0);
  const buyersLinked = linked.reduce((a, p) => a + safe(p.buyers), 0);
  const sigContacts = patterns.filter(p => p.key === 'sig' || /\+sig$/.test(p.key)).reduce((a, p) => a + safe(p.visitors), 0);
  const contacts = uniqueOut + safe(pat.sig.contacts);
  const newB = sum('newB'), repB = sum('repB'), swB = sum('swB'), repurchasers = sum('repurchasers');
  const repurchaseRate = div(repurchasers, buyers);
  const ltvPerBuyer = C.UNIT_PRICE * (1 + repurchaseRate * C.LTV_FUTURE_PURCHASES);
  const ltvTotal = buyers * ltvPerBuyer;
  const spend = (plan.tv + plan.dooh + plan.dig + plan.sig) * 10000;

  // 購入者の属性（セグメント構成から推定。接触経路によって行動属性・購買傾向が変化）
  const w = seg.map(s => div(s.buyers, buyers));
  const wsum = (fn) => SEGMENTS.reduce((a, S, i) => a + w[i] * fn(S.prof, i), 0);
  const doohShareBuyers = div(seg.reduce((a, s) => a + s.doohBuyers, 0), buyers);
  const sigShareBuyers = div(seg.reduce((a, s) => a + s.sigBuyers, 0), buyers);
  const digShareBuyers = div(seg.reduce((a, s) => a + s.digBuyers, 0), buyers);
  const f = wsum(p => p.f), m = wsum(p => p.m);
  const attrs = {
    gender: { f: f, m: m, o: Math.max(0, 1 - f - m) },
    age: [0, 1, 2, 3].map(i => wsum(p => p.age[i])),
    station: clamp(wsum(p => p.station) + 0.22 * (doohShareBuyers - 0.35), 0.05, 0.95),
    drug: clamp(wsum(p => p.drug) + 0.20 * (sigShareBuyers - 0.45), 0.05, 0.95),
    hair: clamp(wsum(p => p.hair) * (plan.msg === 'func' ? 1.04 : 1) + 0.05 * (digShareBuyers - 0.3), 0.05, 0.97),
    cosme: clamp(wsum(p => p.cosme) * (plan.target === 'f2030' ? 1.05 : 1) + 0.08 * (digShareBuyers - 0.3), 0.05, 0.95),
    healthFood: clamp(wsum(p => p.health) + 0.05 * (sigShareBuyers - 0.45), 0.05, 0.95),
    fitness: clamp(wsum(p => p.fitness) + 0.06 * (digShareBuyers - 0.3), 0.05, 0.95),
    salon: clamp(wsum(p => p.salon) * (plan.msg === 'func' ? 1.04 : 1), 0.05, 0.95)
  };

  return {
    round: round, plan: plan, bonuses: bonus.list,
    insight: { used: !!ins, seg: ins ? ins.seg : -1, segName: ins ? ins.segName : '', targetMatch: insT, msgMatch: insM }, sigContactRate: c, sigCapacity: sigCapacity,
    reach: { tv: reachU.tv, dooh: reachU.dooh, dig: reachU.dig, sig: sigCapacity },
    contacts: contacts, visitors: visitors, sigContacts: sigContacts, buyersLinked: buyersLinked, buyers: buyers,
    unlinkedBuyers: safe(pat.none.buyers),
    newB: newB, repB: repB, swB: swB, repurchasers: repurchasers,
    visitRate: div(visitors, contacts), sigRate: div(sigContacts, visitors + safe(pat.none.visitors)), buyRate: div(buyersLinked, visitors),
    newRate: div(newB, buyers), repShare: div(repB, buyers), swRate: div(swB, buyers),
    repurchaseRate: repurchaseRate,
    ltvPerBuyer: ltvPerBuyer, ltvTotal: ltvTotal, roas: div(ltvTotal, spend), cpa: div(spend, buyersLinked),
    patterns: patterns, segments: seg, attrs: attrs
  };
}

/* 購入者分析から「購入につながりやすい顧客層」を見つける。
   購買指数＝その層の（購入者数÷接触機会）÷全体平均。ターゲティングとメッセージの影響を除いて比べる */
function segmentInsight(res) {
  // 広告メッセージとの相性による上振れも除き、その層がもともと持つ購入のしやすさを比べる
  const msg = MESSAGES.find(m => m.id === res.plan.msg) || MESSAGES[0];
  const base = res.segments.map((sg, i) => sg.contacts + CONFIG.ORGANIC_SHOPPERS * SEGMENTS[i].share);
  const adj = res.segments.map((sg, i) => div(sg.buyers, Math.pow(msg.aff[i], 1.5)));
  const totalRate = div(adj.reduce((a, v) => a + v, 0), base.reduce((a, v) => a + v, 0));
  const list = res.segments.map((sg, i) => ({ i: i, name: SEGMENTS[i].name, share: div(sg.buyers, res.buyers), index: div(div(adj[i], base[i]), totalRate) }));
  const top = list.filter(x => x.i !== 4).sort((a, b) => b.index - a.index)[0];
  return Object.assign({ seg: top.i, segName: top.name, index: top.index, list: list, fromRound: res.round }, SEG_INSIGHT[top.i]);
}

/* タイプ別の再購入率（新規・リピート・スイッチ候補） */
function repurchaseByType(res) {
  // パターン別の再購入者数をタイプ別に再計算するため、平均値を近似で求める
  const plan = res.plan;
  const msg = MESSAGES.find(m => m.id === plan.msg) || MESSAGES[0];
  const b = CONFIG.REPURCHASE_BASE;
  const sigW = div(res.sigContacts, res.visitors + 1);
  const sigMul = 1 + (CONFIG.REPURCHASE_SIG - 1) * clamp(sigW, 0, 1);
  const bonus = res.bonuses.some(t => t.indexOf('再購入率') >= 0) ? CONFIG.BONUS.repeatCont : 1;
  const raw = { new: b.new * msg.repMod.new, rep: b.rep * msg.repMod.rep, sw: b.sw * msg.repMod.sw };
  const est = { new: raw.new * sigMul * bonus, rep: raw.rep * sigMul * bonus, sw: raw.sw * sigMul * bonus };
  // 全体の実測値と整合させるためにスケーリング
  const estTotal = div(est.new * res.newB + est.rep * res.repB + est.sw * res.swB, res.buyers);
  const k = estTotal > 0 ? res.repurchaseRate / estTotal : 1;
  return { new: clamp(est.new * k, 0, 0.9), rep: clamp(est.rep * k, 0, 0.9), sw: clamp(est.sw * k, 0, 0.9) };
}

/* スコア計算（ROUND 3の成果で評価） */
function computeScore(res) {
  const S = CONFIG.SCORE;
  const lin = (v, r) => clamp((safe(v) - r[0]) / (r[1] - r[0]), 0, 1);
  const items = [
    { key: 'visit', label: '来店獲得', max: 20, ratio: lin(res.visitors, S.visit) },
    { key: 'buy', label: '購買獲得', max: 20, ratio: lin(res.buyers, S.buyers) },
    { key: 'new', label: '新規顧客獲得', max: 20, ratio: lin(res.newB, S.newB) },
    { key: 'sw', label: 'ブランドスイッチ候補獲得', max: 15, ratio: lin(res.swB, S.sw) },
    { key: 'rep', label: '再購入率', max: 15, ratio: lin(res.repurchaseRate, S.repurchase) },
    { key: 'roas', label: '広告費用対効果', max: 10, ratio: lin(res.roas, S.roas) }
  ];
  items.forEach(i => { i.pt = Math.round(i.ratio * i.max); });
  const total = clamp(items.reduce((a, i) => a + i.pt, 0), 0, 100);
  return { items: items, total: total, title: scoreTitle(total) };
}
function scoreTitle(t) {
  if (t >= 90) return 'リテールメディア・マスター';

/* =====================================================================
   6. 状態を変更するアクション
   ===================================================================== */
function setBudget(key, value) {
  const plan = state.plans[state.round];
  if (!plan) return;
  const T = CONFIG.BUDGET_TOTAL, step = CONFIG.BUDGET_STEP;
  const v = Math.round(clamp(value, 0, T) / step) * step;
  // 動かした媒体以外を、いまの比率を保ったまま調整して合計を常に1,000万円にする
  const others = BUDGET_KEYS.filter(k => k !== key);
  const remain = T - v;
  const cur = others.map(k => safe(plan[k]));
  const curSum = cur.reduce((x, y) => x + y, 0);
  let left = remain;
  others.forEach((k, i) => {
    if (i === others.length - 1) { plan[k] = left; return; }
    const share = curSum > 0 ? cur[i] / curSum : 1 / others.length;
    const nv = clamp(Math.round(remain * share / step) * step, 0, left);
    plan[k] = nv; left -= nv;
  });
  plan[key] = v;
}
function deliver() {
  if (state.busy) return;
  const r = state.round;
  const plan = state.plans[r];
  if (!plan || !plan.msg || !plan.target) return;
  if (budgetTotal(plan) !== CONFIG.BUDGET_TOTAL) return;
  if (state.results[r]) { go('run', r); return; }  // 二重計算しない
  state.busy = true;
  state.results[r] = simulate(plan, state.seed, r, { hot: state.hot, insight: r >= 2 ? getInsight(r) : null });
  go('run', r);
}
/* ROUND rで使える示唆＝直前のラウンドの購入者分析から得た示唆 */
function getInsight(r) { const prev = state.results[r - 1]; return prev ? segmentInsight(prev) : null; }
function nextRound() {
  if (state.round >= 3) return;
  const prev = state.plans[state.round];
  state.round += 1;
  if (!state.plans[state.round]) state.plans[state.round] = { tv: prev.tv, dooh: prev.dooh, dig: prev.dig, sig: prev.sig, msg: null, target: null };
  go('plan', state.round);
}
function restart() {
  clearTimers();
  state = createState();
  state.tutorial = 0;
  go('intro', 1);
}

const PX_ORDER = ['tv', 'signage', 'phone', 'cart', 'bottle', 'coin'];
function pixelSvg(name) {
  const ic = PX_ICONS[name]; if (!ic) return '';
  let rects = '';
  ic.rows.forEach((row, y) => {
    let x = 0;
    while (x < row.length) {          // 横に並んだ同じ色のマスは1つの四角にまとめる
      const ch = row[x]; let w = 1;
      while (x + w < row.length && row[x + w] === ch) w++;
      if (PX_COLORS[ch]) rects += '<rect x="' + x + '" y="' + y + '" width="' + w + '" height="1" fill="' + PX_COLORS[ch] + '"/>';
      x += w;
    }
  });
  return '<svg viewBox="0 0 12 12" shape-rendering="crispEdges" aria-hidden="true" focusable="false">' + rects + '</svg>';
}

function heroAnimation() {
  const cv = $('#heroCanvas'); if (!cv) return;
  const ctx = setupCanvas(cv); if (!ctx) return;
  const W = cv.clientWidth, H = cv.clientHeight;
  const rng = mulberry32(state.seed);
  const people = Array.from({ length: 34 }, (_, i) => ({ x: rng() * W, y: 20 + rng() * (H - 40), s: 0.25 + rng() * 0.5, c: i % 7 === 0 ? '#ee6a4d' : (i % 5 === 0 ? '#c8952a' : '#2bb39b') }));
  const draw = (dt) => {
    ctx.clearRect(0, 0, W, H);
    ctx.strokeStyle = 'rgba(255,255,255,.12)'; ctx.setLineDash([3, 5]);
    [0.2, 0.5, 0.8].forEach(f => { ctx.beginPath(); ctx.moveTo(W * f, 6); ctx.lineTo(W * f, H - 6); ctx.stroke(); });
    ctx.setLineDash([]);
    people.forEach(p => { if (!reduceMotion) { p.x += p.s * dt * 0.06; if (p.x > W + 8) p.x = -8; } drawPerson(ctx, p.x, p.y, 1, p.c, 1); });
  };
  let last = performance.now();
  const loop = (now) => {
    if (!document.body.contains(cv)) return;
    draw(Math.min(50, now - last)); last = now;
    if (!reduceMotion) anim.raf = requestAnimationFrame(loop);
  };
  anim.raf = requestAnimationFrame(loop);
}

/* 人物アイコンの描画 */
function drawPerson(ctx, x, y, scale, color, alpha, shape) {
  ctx.globalAlpha = alpha;
  ctx.fillStyle = color;
  const s = scale;
  ctx.beginPath(); ctx.arc(x, y - 4.2 * s, 2.5 * s, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath();
  if (ctx.roundRect) ctx.roundRect(x - 3 * s, y - 1.2 * s, 6 * s, 6.4 * s, [3 * s, 3 * s, 1 * s, 1 * s]);
  else ctx.rect(x - 3 * s, y - 1.2 * s, 6 * s, 6.4 * s);
  ctx.fill();
  if (shape === 'rep') { ctx.fillStyle = '#ffffff'; ctx.fillRect(x - 1.2 * s, y + 0.6 * s, 2.4 * s, 2.4 * s); }
  if (shape === 'sw') { ctx.fillStyle = '#ffffff'; ctx.beginPath(); ctx.moveTo(x, y + 0.2 * s); ctx.lineTo(x + 1.6 * s, y + 1.8 * s); ctx.lineTo(x, y + 3.4 * s); ctx.lineTo(x - 1.6 * s, y + 1.8 * s); ctx.fill(); }
  if (shape === 'gold') { ctx.strokeStyle = '#8a620c'; ctx.lineWidth = 1; ctx.beginPath(); ctx.arc(x, y - 4.2 * s, 3.6 * s, 0, Math.PI * 2); ctx.stroke(); }
  ctx.globalAlpha = 1;
}
function setupCanvas(cv) {
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  const w = Math.max(1, cv.clientWidth), h = Math.max(1, cv.clientHeight);
  cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
  const ctx = cv.getContext('2d'); if (!ctx) return null;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  return ctx;
}
function runFunnel(res, locked, vals, instant, onDone) {
  const cv = $('#funnelCanvas'); if (!cv) { onDone(); return; }
  const ctx = setupCanvas(cv); if (!ctx) { onDone(); return; }
  const W = cv.clientWidth, H = cv.clientHeight;
  const maxStage = locked ? 3 : 5;
  const N0 = W < 600 ? 70 : 120;
  const base = Math.max(1, vals[0]);
  const n = vals.map((v, i) => i === 0 ? N0 : Math.max(3, Math.round(N0 * Math.pow(div(v, base), 0.3))));
  for (let i = 1; i < 6; i++) n[i] = Math.min(n[i], n[i - 1]);
  const xs = [0, 1, 2, 3, 4, 5].map(i => W * (i + 0.5) / 6);
  const hh = [0, 1, 2, 3, 4, 5].map(i => H * 0.42 * (1 - i * 0.12));
  const rng = mulberry32((state.seed + res.round * 977) >>> 0);
  const shares = [res.newB, res.repB, res.swB].map(v => div(v, res.buyers));
  const dots = [];
  for (let i = 0; i < N0; i++) {
    let fin = 0; for (let k = 5; k >= 0; k--) { if (i < n[k]) { fin = k; break; } }
    fin = Math.min(fin, maxStage);
    const u = rng() * 2 - 1;
    const tr = rng();
    const type = tr < shares[0] ? 'new' : (tr < shares[0] + shares[1] ? 'rep' : 'sw');
    dots.push({ fin: fin, u: u, delay: rng() * 1.5, type: type, j: rng() * Math.PI * 2 });
  }
  const SP = 0.6; // 1ステージあたりの秒数
  const total = 1.5 + (maxStage + 0.7) * SP + 1.0;
  const counters = $$('.stage-counters .v');
  const started = new Set();
  const startCounter = (k) => {
    if (started.has(k)) return; started.add(k);
    if (!instant && k === 3) Sound.sfx('coin');
    if (!instant && k === 5 && !locked) Sound.sfx('sparkle');
    if (locked && k >= 4) return;
    const el = counters[k]; if (!el) return;
    countUp(el, vals[k], fmt.num, instant ? 0 : 900);
  };
  const colorFor = (d, pos) => {
    if (pos >= 4.5 && d.fin >= 5) return ['#c8952a', 'gold'];
    if (pos >= 3.6 && !locked) return d.type === 'new' ? ['#2bb39b', 'new'] : (d.type === 'rep' ? ['#132a4f', 'rep'] : ['#b8432a', 'sw']);
    if (pos >= 2.6 && d.fin >= 3) return ['#ee6a4d', null];
    return ['#2a4878', null];
  };
  const drawBg = () => {
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = 'rgba(19,42,79,0.045)';
    ctx.beginPath(); ctx.moveTo(0, H / 2 - hh[0]);
    xs.forEach((x, i) => ctx.lineTo(x, H / 2 - hh[i]));
    ctx.lineTo(W, H / 2 - hh[5]); ctx.lineTo(W, H / 2 + hh[5]);
    for (let i = 5; i >= 0; i--) ctx.lineTo(xs[i], H / 2 + hh[i]);
    ctx.lineTo(0, H / 2 + hh[0]); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = 'rgba(19,42,79,0.16)'; ctx.setLineDash([3, 4]); ctx.lineWidth = 1;
    xs.forEach(x => { ctx.beginPath(); ctx.moveTo(x, 4); ctx.lineTo(x, H - 4); ctx.stroke(); });
    ctx.setLineDash([]);
    if (locked) {
      ctx.fillStyle = 'rgba(19,42,79,0.06)'; ctx.fillRect(xs[4] - W / 12, 0, W / 6 * 2, H);
      ctx.fillStyle = '#5a6378'; ctx.font = '700 13px ' + getComputedStyle(document.body).fontFamily; ctx.textAlign = 'center';
      ctx.fillText('購入者の中身は、まだ見えていません', (xs[4] + xs[5]) / 2, H / 2 - 6);
      ctx.font = '12px ' + getComputedStyle(document.body).fontFamily;
      ctx.fillText('「購入者を詳しく分析する」でアンロック', (xs[4] + xs[5]) / 2, H / 2 + 14);
    }
  };
  const lerpArr = (arr, pos) => { const p = clamp(pos, 0, 5); const i = Math.floor(p); const f = p - i; return i >= 5 ? arr[5] : arr[i] + (arr[i + 1] - arr[i]) * f; };
  const frame = (t) => {
    drawBg();
    const sc = W < 600 ? 1.0 : 1.25;
    dots.forEach(d => {
      const local = t - d.delay;
      if (local < 0) return;
      let pos = -0.5 + local / SP;
      let drop = 0;
      if (pos >= d.fin) {
        const over = (pos - d.fin) * SP;
        pos = d.fin;
        if (d.fin < maxStage) drop = over;
      }
      if (pos >= 0) for (let k = 0; k <= Math.floor(pos); k++) startCounter(k);
      let x = pos < 0 ? xs[0] + pos * (W / 6) : lerpArr(xs, pos);
      const half = pos < 0 ? hh[0] : lerpArr(hh, pos);
      let y = H / 2 + d.u * (half - 8) + Math.sin(local * 3 + d.j) * 1.2;
      let a = 1;
      // 到達したステージで止まった人は、少し横に散らばって待機
      const rest = clamp((local / SP - 0.5 - d.fin) * 2, 0, 1);
      if (pos >= d.fin) x += Math.cos(d.j) * (W / 22) * rest * (d.fin < maxStage ? 0.6 : 1);
      // 離脱した人は下に沈み、薄く残ってファネルの形を示す
      if (drop > 0) { y += Math.min(drop, 0.45) * 50; a = clamp(1 - drop / 0.6, 0.16, 1); }
      const col = colorFor(d, pos);
      drawPerson(ctx, x, y, sc, col[0], a * (drop > 0 ? 0.6 : 0.92), col[1]);
    });
  };
  if (instant) {
    frame(total + 5);
    for (let k = 0; k < 6; k++) startCounter(k);
    onDone();
    return;
  }
  const t0 = performance.now();
  let finished = false;
  const finish = () => { if (finished) return; finished = true; frame(total + 5); for (let k = 0; k < 6; k++) startCounter(k); onDone(); };
  anim.finish = finish;
  const loop = (now) => {
    if (!document.body.contains(cv)) { finished = true; state.busy = false; return; }
    const t = (now - t0) / 1000;
    frame(t);
    if (t < total) anim.raf = requestAnimationFrame(loop); else finish();
  };
  anim.raf = requestAnimationFrame(loop);
}

/* カウントアップ */
function countUp(el, to, formatter, dur) {
  to = safe(to);
  const f = formatter || fmt.num;
  if (!dur || reduceMotion) { el.textContent = f(to); return; }
  const t0 = performance.now();
  const step = (now) => {
    if (!document.body.contains(el)) return;
    const p = clamp((now - t0) / dur, 0, 1);
    const e = 1 - Math.pow(1 - p, 3);
    el.textContent = f(to * e);
    if (p < 1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}
function countUpAll(root) {
  $$('[data-count]', root).forEach(el => {
    const kind = el.getAttribute('data-fmt');
    const f = kind === 'yen' ? fmt.yen : (kind === 'pct' ? (v) => fmt.pct(v) : (kind === 'yenL' ? fmt.yenLarge : fmt.num));
    countUp(el, Number(el.getAttribute('data-count')), f, 1000);
  });
}

function drawDonutAnimated(cv, parts, instant) {
  const ctx = setupCanvas(cv); if (!ctx) return;
  const W = cv.clientWidth, H = cv.clientHeight;
  const tot = parts.reduce((a, p) => a + safe(p.v), 0) || 1;
  const draw = (p) => {
    ctx.clearRect(0, 0, W, H);
    const cx = W / 2, cy = H / 2, R = Math.min(W, H) / 2 - 4, r0 = R * 0.6;
    ctx.fillStyle = '#efe9de'; ctx.beginPath(); ctx.arc(cx, cy, R, 0, Math.PI * 2); ctx.arc(cx, cy, r0, 0, Math.PI * 2, true); ctx.fill();
    let a = -Math.PI / 2;
    parts.forEach(pt => {
      const sweep = safe(pt.v) / tot * Math.PI * 2 * p;
      if (sweep <= 0) return;
      ctx.fillStyle = pt.c; ctx.beginPath(); ctx.arc(cx, cy, R, a, a + sweep); ctx.arc(cx, cy, r0, a + sweep, a, true); ctx.closePath(); ctx.fill();
      ctx.strokeStyle = '#fffdf9'; ctx.lineWidth = 2; ctx.stroke();
      a += sweep;
    });
    ctx.fillStyle = '#132a4f'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.font = '800 15px ' + getComputedStyle(document.body).fontFamily;
    ctx.fillText(fmt.num(tot * p), cx, cy - 6);
    ctx.font = '10px ' + getComputedStyle(document.body).fontFamily; ctx.fillStyle = '#5a6378';
    ctx.fillText('購入者', cx, cy + 10);
  };
  if (instant) { draw(1); return; }
  const t0 = performance.now();
  const step = (now) => { if (!document.body.contains(cv)) return; const p = clamp((now - t0) / 900, 0, 1); draw(1 - Math.pow(1 - p, 3)); if (p < 1) requestAnimationFrame(step); };
  requestAnimationFrame(step);
}

  if (Rank.status === 'loading') return 'ランキングを読み込んでいます…';
  if (Rank.status === 'slow') return 'ランキングの読み込みに時間がかかっています。通信状況をご確認ください。';
  if (Rank.status === 'error') return 'ランキングを読み込めませんでした。ページを開き直してください。';
  return '';
}
function saveStatusHtml() {
  const map = {
    saving: ['', 'スコアをランキングに登録しています…'],
    saved: ['ok', Rank.lastBest ? '自己ベストを更新！ランキングに登録しました。' : 'ランキングに記録しました（自己ベストは前回以前の記録です）。'],
    readonly: ['warn', 'この閲覧権限ではスコアを登録できません。共有リンクの権限（Contributor以上）をご確認ください。'],
    unavailable: ['warn', 'このページではランキングに登録できません（Claudeの共有リンクから開くと登録されます）。'],
    error: ['warn', 'スコアを登録できませんでした。もう一度プレイすると再登録されます。']
  };
  const m = map[Rank.save]; if (!m) return '';
  return '<p class="save-note ' + m[0] + '" role="status">' + m[1] + '</p>';
}
/* ランキング表を描く。compact=最終結果画面用の上位5件 */
function paintRank(box) {
  const compact = box.getAttribute('data-rank-box') === 'compact';
  const rows = rankedRows();
  const status = rankStatusText();
  let html = '';
  if (compact) html += saveStatusHtml();
  if (status && !rows.length) { box.innerHTML = html + '<p class="rank-empty">' + status + '</p>'; return; }
  if (!rows.length) { box.innerHTML = html + '<p class="rank-empty">まだ記録がありません。ゲームを最後までプレイすると、ここにスコアが載ります。</p>'; return; }
  const mine = rows.find(r => r.id === Rank.uid);
  if (!compact) {
    const plays = rows.reduce((a, r) => a + (Number(r.plays) || 0), 0);
    const avg = rows.reduce((a, r) => a + r.bestScore, 0) / rows.length;
    html += '<div class="rank-stats">' +
      '<div><span>参加者</span><b class="num">' + rows.length + '<small>人</small></b></div>' +
      '<div><span>総プレイ回数</span><b class="num">' + plays + '<small>回</small></b></div>' +
      '<div><span>平均ベストスコア</span><b class="num">' + avg.toFixed(1) + '<small>点</small></b></div>' +
      '<div><span>最高スコア</span><b class="num">' + rows[0].bestScore + '<small>点</small></b></div></div>';
  }
  if (mine) html += '<p class="my-rank">あなたは <b class="num">' + mine.rank + '位</b>（' + rows.length + '人中）・ベスト <b class="num">' + mine.bestScore + '点</b></p>';
  let shown = compact ? rows.slice(0, 5) : rows;
  if (compact && mine && mine.rank > 5) shown = shown.concat([mine]);
  html += '<div class="rank-table-wrap"><table class="rank-table"><thead><tr><th scope="col">順位</th><th scope="col">プレイヤー</th><th scope="col">ベストスコア</th>' +
    (compact ? '' : '<th scope="col">称号</th><th scope="col">プレイ回数</th><th scope="col">最終プレイ</th>' + (Rank.isOwner ? '<th scope="col"><span class="sr-only">管理</span></th>' : '')) + '</tr></thead><tbody>' +
    shown.map(r => {
      const medal = r.rank <= 3 ? ' medal m' + r.rank : '';
      const del = Rank.isOwner && !compact ? '<td class="del">' + (Rank.confirmDel === r.id
        ? '<button class="btn btn-sm btn-danger" data-action="rank-del-yes" data-id="' + esc(r.id) + '">削除する</button> <button class="btn btn-sm btn-ghost" data-action="rank-del-no">やめる</button>'
        : '<button class="btn btn-sm btn-ghost" data-action="rank-del" data-id="' + esc(r.id) + '">記録を削除</button>') + '</td>' : '';
      return '<tr class="' + (r.id === Rank.uid ? 'me' : '') + '"><td><span class="rank-no num' + medal + '">' + r.rank + '</span></td>' +
        '<td class="who"><div class="who-in"><img class="avatar" alt="" data-avatar="' + esc(r.id) + '"><span class="pname" data-name="' + esc(r.id) + '">…</span>' + (r.id === Rank.uid ? '<span class="chip mint">あなた</span>' : '') + '</div></td>' +
        '<td class="score num"><b>' + r.bestScore + '</b> 点</td>' +
        (compact ? '' : '<td>' + esc((r.best && r.best.title) || scoreTitle(r.bestScore)) + '</td><td class="num">' + (Number(r.plays) || 0) + ' 回</td><td class="num">' + fmtWhen(r.lastAt) + '</td>' + del) + '</tr>';
    }).join('') + '</tbody></table></div>';
  if (status) html += '<p class="rank-empty">' + status + '</p>';
  box.innerHTML = html;
  // 名前とアイコンはIDから表示のたびに解決する（保存はしない）
  if (Rank.user) {
    const ids = shown.map(r => r.id);
    Rank.user.profiles(ids).then(ps => {
      $$('[data-name]', box).forEach(el => { const p = ps[el.getAttribute('data-name')]; el.textContent = (p && p.name) || 'プレイヤー'; });
      $$('[data-avatar]', box).forEach(el => { const p = ps[el.getAttribute('data-avatar')]; if (p && p.avatarUrl) el.src = p.avatarUrl; else el.remove(); });
    }).catch(() => { $$('[data-name]', box).forEach(el => { el.textContent = 'プレイヤー'; }); });
  } else {
    $$('[data-name]', box).forEach(el => { el.textContent = 'プレイヤー'; });
    $$('[data-avatar]', box).forEach(el => el.remove());
  }
}
function paintRankAll() { $$('[data-rank-box]').forEach(paintRank); }
function renderRanking() {
  stage.innerHTML =
    '<section class="screen">' +
    screenHead('LEADERBOARD', '🏆 ランキング', 'ゲームを最後までプレイした人の、ベストスコア順です。新しい記録はリアルタイムで反映されます。',
      '<button class="btn btn-ghost" data-action="rank-back">ゲームに戻る</button>') +
    '<div class="panel rank-panel" data-rank-box="full"></div>' +
    (Rank.isOwner ? '<p class="note">あなたはこのゲームの作成者なので、テストプレイなどの記録を削除できます。他のプレイヤーには削除ボタンは表示されません。</p>' : '') +
    '</section>';
  paintRankAll();
}

/* =====================================================================
   9. イベント処理
   ===================================================================== */
document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-action]');
  if (!el || el.disabled || el.getAttribute('aria-disabled') === 'true') return;
  const act = el.getAttribute('data-action');
  if (act === 'toggle-bgm' || act === 'toggle-sfx') { Sound.toggle(act === 'toggle-bgm' ? 'bgm' : 'sfx'); return; }
  const SFX_FOR = { deliver: 'deliver', start: 'confirm', analyze: 'confirm', 'to-next': 'confirm', 'next-round': 'confirm', ending: 'confirm', report: 'confirm', 'reveal-all': 'reveal', 'tut-prev': 'back', 'view-analysis': 'back', 'view-run': 'back', 'back-plan': 'back' };
  Sound.sfx(act === 'pico' ? (el.getAttribute('data-icon') === 'coin' ? 'coin' : 'select') : (SFX_FOR[act] || 'click'));
  const rd = Number(el.getAttribute('data-round')) || state.viewRound;
  switch (act) {
    case 'tut-next': state.tutorial = clamp(state.tutorial + 1, 0, 2); renderIntro(); focusFirst('[data-action="tut-next"],[data-action="start"]'); break;
    case 'tut-prev': state.tutorial = clamp(state.tutorial - 1, 0, 2); renderIntro(); focusFirst('[data-action="tut-prev"]:not([disabled]),[data-action="tut-next"]'); break;
    case 'start': go('plan', 1); break;
    case 'equal': { const p = state.plans[state.viewRound]; if (p && !state.results[state.viewRound]) { p.tv = 250; p.dooh = 250; p.dig = 250; p.sig = 250; updatePlanReadouts(); } break; }
    case 'reset-budget': { const p = state.plans[state.viewRound]; if (p && !state.results[state.viewRound]) { const d = defaultPlan(); p.tv = d.tv; p.dooh = d.dooh; p.dig = d.dig; p.sig = d.sig; updatePlanReadouts(); } break; }
    case 'deliver': el.disabled = true; deliver(); break;
    case 'skip-anim': if (anim.finish) anim.finish(); break;
    case 'analyze': go('analysis', state.viewRound); break;
    case 'reveal-all': if (anim.revealAll) anim.revealAll(); break;
    case 'to-next': if (state.viewRound >= 3) go('final', 3); else go('next', state.viewRound); break;
    case 'next-round': if (!state.busy) { if (state.round === state.viewRound) nextRound(); else go('plan', state.round); } break;
    case 'view-analysis': go('analysis', rd); break;
    case 'view-run': go('run', rd); break;
    case 'back-plan': go(state.results[state.round] ? 'run' : 'plan', state.round); break;
    case 'ending': go('ending', 3); break;
    case 'report': go('report', 3); break;
    case 'print': try { window.print(); } catch (err) { const n = $('#printNote'); if (n) n.textContent = '印刷を開始できませんでした。HTMLファイルをブラウザで開いてお試しください。'; } break;
    case 'restart': restart(); break;
    case 'ranking': if (state.screen !== 'ranking') { state.rankFrom = { screen: state.screen, round: state.viewRound }; go('ranking', state.viewRound); } break;
    case 'rank-back': { const f = state.rankFrom || { screen: 'intro', round: 1 }; go(f.screen === 'ranking' ? 'intro' : f.screen, f.round); break; }
    case 'rank-del': Rank.confirmDel = el.getAttribute('data-id'); paintRankAll(); break;
    case 'rank-del-no': Rank.confirmDel = null; paintRankAll(); break;
    case 'rank-del-yes': deleteEntry(el.getAttribute('data-id')); break;
    case 'pico': el.classList.remove('px-jump'); void el.offsetWidth; el.classList.add('px-jump'); break;
  }
});
function focusFirst(sel) { const b = $(sel, stage); if (b) try { b.focus(); } catch (e) { /* noop */ } }
/* 店内サイネージのスライダーで予算を上げたら上昇音と「イエーイ！」の吹き出し、下げたら下降音と「あーあ…」の吹き出し（音声読み上げはしない）。
   スライダーを動かしている間はまとめて、手を止めた時点の増減で1回だけ反応する */
const sigWatch = { base: null, timer: 0 };
function watchSignage(before) {
  if (sigWatch.base === null) sigWatch.base = before;
  clearTimeout(sigWatch.timer);
  sigWatch.timer = setTimeout(() => {
    const p = state.plans[state.viewRound];
    const base = sigWatch.base; sigWatch.base = null;
    if (!p || state.screen !== 'plan' || base === null) return;
    const d = p.sig - base;
    if (d > 0) { Sound.sfx('yay'); sigBubble('yay', d); }
    else if (d < 0) { Sound.sfx('aww'); sigBubble('aww', d); }
  }, 450);
}
function sigBubble(kind, d) {
  const host = $('#reach-sig'); if (!host) return;
  const old = $('.sig-bubble'); if (old) old.remove();
  const b = document.createElement('span');
  b.className = 'sig-bubble ' + kind; b.setAttribute('role', 'status');
  b.textContent = (kind === 'yay' ? 'イエーイ！ ' : 'あーあ… ') + (d > 0 ? '+' : '−') + fmt.man(Math.abs(d));
  host.parentNode.insertBefore(b, host);
  setTimeout(() => { if (b.parentNode) b.remove(); }, 1800);
}
document.addEventListener('input', (e) => {
  const t = e.target;
  if (t && t.matches('input[type=range][data-media]')) {
    if (state.results[state.viewRound]) return;
    // サイネージのスライダーを直接動かしたときだけ反応（他の媒体を動かして相対的に変わったときは鳴らさない）
    const pl = state.plans[state.viewRound]; if (pl && t.getAttribute('data-media') === 'sig') watchSignage(pl.sig);
    setBudget(t.getAttribute('data-media'), Number(t.value));
    Sound.sfx('tick');
    updatePlanReadouts();
  }
});
document.addEventListener('change', (e) => {
  const t = e.target;
  if (!t || t.type !== 'radio') return;
  const p = state.plans[state.viewRound];
  if (!p || state.results[state.viewRound]) return;
  Sound.sfx('select');
  if (t.name === 'msg') p.msg = t.value;
  if (t.name === 'target' && state.viewRound > 1) p.target = t.value;
  updatePlanReadouts();
  renderTopbar();
});
let resizeT = 0;
window.addEventListener('resize', () => {
  clearTimeout(resizeT);
  resizeT = setTimeout(() => {
    if (state.screen === 'run' && !state.busy) {
      const res = state.results[state.viewRound];
      if (res) runFunnel(res, state.viewRound === 1 && !state.analyzed[1], stageValues(res), true, () => {});
    }
  }, 200);
});

Sound.renderButtons();
initRanking();
render();
</script>
